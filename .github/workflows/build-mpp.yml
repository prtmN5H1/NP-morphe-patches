name: Build Custom Morphe Patch (.mpp)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Morphe Patches Template
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build MPP Patch Bundle
        run: ./gradlew build

      - name: Publish Release for Morphe Manager Source URL
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Custom Morphe Self-Patch v1.0.${{ github.run_number }}
          files: |
            build/libs/*.mpp
            build/libs/patches.json
